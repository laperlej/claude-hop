[package]
name = "claude-hop"
version = "0.1.0"
edition = "2024"
description = "Fuzzy picker for jumping between parallel Claude Code instances"
license = "MIT"
repository = "https://github.com/laperlej/claude-hop"
keywords = ["claude", "terminal", "tui", "tmux", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
nucleo = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
anyhow = "1"
